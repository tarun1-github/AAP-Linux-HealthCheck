---
- name: Test AAP Execution
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Show hostname
      ansible.builtin.debug:
        msg: "AAP execution environment hostname: {{ ansible_facts.hostname }}"

    - name: Show operating system
      ansible.builtin.debug:
        msg: "OS: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}"

    - name: Show success
      ansible.builtin.debug:
        msg: "AAP Ansible job executed successfully!"