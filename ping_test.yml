---
- name: Linux Health Check
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:

    - name: Show hostname
      ansible.builtin.debug:
        msg: "Hostname: {{ ansible_facts.hostname }}"

    - name: Show OS
      ansible.builtin.debug:
        msg: "OS: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}"

    - name: Show kernel
      ansible.builtin.debug:
        msg: "Kernel: {{ ansible_facts.kernel }}"

    - name: Show CPU
      ansible.builtin.debug:
        msg: "CPU cores: {{ ansible_facts.processor_vcpus }}"

    - name: Show uptime
      ansible.builtin.debug:
        msg: "Uptime: {{ ansible_uptime_seconds }} seconds"

    - name: Show memory
      ansible.builtin.debug:
        msg: "Memory: {{ ansible_memtotal_mb }} MB total, {{ ansible_memfree_mb }} MB free"

    - name: Check root filesystem
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import os

            stat = os.statvfs("/")

            total = stat.f_blocks * stat.f_frsize
            free = stat.f_bavail * stat.f_frsize
            used = total - (stat.f_bfree * stat.f_frsize)

            total_gb = total / (1024 ** 3)
            free_gb = free / (1024 ** 3)
            used_gb = used / (1024 ** 3)
            used_pct = (used / total * 100) if total else 0

            print(
                f"Root filesystem: "
                f"Total={total_gb:.2f} GB, "
                f"Used={used_gb:.2f} GB, "
                f"Free={free_gb:.2f} GB, "
                f"Used%={used_pct:.1f}%"
            )
      register: root_fs
      changed_when: false

    - name: Show root filesystem
      ansible.builtin.debug:
        msg: "{{ root_fs.stdout }}"

    - name: Show success
      ansible.builtin.debug:
        msg: "Linux health check completed successfully"